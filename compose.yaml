services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plainly
      POSTGRES_PASSWORD: plainly
      POSTGRES_DB: plainly
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - plainly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainly"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  plainly_data:
